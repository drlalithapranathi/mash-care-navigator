<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MASH Care Navigator – Launching…</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f0f4f8;
        color: #1e3a5f;
      }
      .box { text-align: center; padding: 2rem; max-width: 32rem; }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #bfdbfe;
        border-top-color: #1d4ed8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #launch-message { font-size: 0.9rem; line-height: 1.5; color: #475569; }
      code { background: #e2e8f0; padding: 0 0.25rem; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <h2>MASH Care Navigator</h2>
      <p>Connecting to your EHR…</p>
      <p id="launch-message"></p>
    </div>
    <script type="module" src="/src/launch.js"></script>
  </body>
</html>

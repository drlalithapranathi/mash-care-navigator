services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6@sha256:5dd14e68ea81f33692b810d096ac8ebe7aa789d75ce91e05f09d56d044ed8ee3
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    environment:
      - DEFAULT_HOST=${VIRTUAL_HOST}
    networks:
      - proxy-net
      - openmrs-net

  acme-companion:
    image: nginxproxy/acme-companion:2.4@sha256:202fffa4e13e52144526425f2014b01c34daa55fec806549aadd329c4ee4441c
    container_name: acme-companion
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
      - NGINX_PROXY_CONTAINER=nginx-proxy
    networks:
      - proxy-net

  db:
    # Supported, patched, digest-pinned MySQL (default 8.0.40). The live pilot box
    # still runs mysql:5.6 (EOL) — migrate it via dump/restore before aligning it
    # to this file (see openmrs/deploy/README.md, #26). To stay on 5.x for now,
    # set MYSQL_IMAGE=mysql:5.6@sha256:20575ecebe6216036d25dab5903808211f1e9ba63dc7825ac20cb975e34cfcae
    # in .env AND drop the --default-authentication-plugin flag below (5.6 rejects it).
    image: ${MYSQL_IMAGE:-mysql:8.0.40@sha256:d58ac93387f644e4e040c636b8f50494e78e5afc27ca0a87348b2f577da2b7ff}
    container_name: openmrs-db
    restart: unless-stopped
    command: >
      mysqld
      --character-set-server=utf8
      --collation-server=utf8_general_ci
      --max_allowed_packet=64M
      --innodb_buffer_pool_size=1G
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:?set MYSQL_DB in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      # Passwords are read from mounted files (Docker secrets), never declared as
      # container env — so they don't leak via `docker inspect` or /proc/<pid>/environ (#33).
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - openmrs-net
    healthcheck:
      # Passwordless liveness: `mysqladmin ping` reports success even when the
      # server refuses auth, which already proves it is accepting connections —
      # so no credential is embedded in the healthcheck argv/config (#33).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  openmrs:
    # Digest-pinned to the validated build (coreapps 1.34.0, RefApp 2.13.x) so a
    # `pull`/recreate can't silently swap the distro out from under the widget.
    # `demo` is only a readable label here — the digest is authoritative, so this
    # is not a rolling tag. Override OPENMRS_IMAGE to move to another release (#26).
    image: ${OPENMRS_IMAGE:-openmrs/openmrs-reference-application-distro:demo@sha256:1088b9cb390665b2186790486bd41de05b8112ba397453b39e340ead9c3d9ad5}
    container_name: openmrs-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # startup.sh templates connection.password from $DB_PASSWORD; inject it from
    # the mounted secret file so the credential is never a declared env var (#33).
    entrypoint: ["/bin/sh", "-c", "export DB_PASSWORD=\"$$(cat /run/secrets/mysql_password)\"; exec /usr/local/tomcat/startup.sh"]
    environment:
      DB_DATABASE: ${MYSQL_DB}
      DB_HOST: db
      DB_USERNAME: ${MYSQL_USER}
      # DB_PASSWORD is injected from /run/secrets/mysql_password by the entrypoint above (#33).
      # Gateable for controlled upgrades: after first provisioning, set
      # DB_AUTO_UPDATE=false in .env and flip it on only for a backed-up upgrade
      # (snapshot with scripts/backup-db.sh first). Defaults preserve first-boot.
      DB_CREATE_TABLES: "${DB_CREATE_TABLES:-true}"
      DB_AUTO_UPDATE: "${DB_AUTO_UPDATE:-true}"
      VIRTUAL_HOST: ${VIRTUAL_HOST:?set VIRTUAL_HOST in .env}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL in .env}
      JAVA_OPTS: >-
        -Xmx2g
        -Xms1g
        -XX:+UseG1GC
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - openmrs-data:/root/.OpenMRS
    networks:
      - proxy-net
      - openmrs-net
    secrets:
      - mysql_password
    healthcheck:
      # So the proxy stops routing to a wedged/booting app. start_period is
      # generous for the slow first-boot Liquibase run.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/openmrs/ws/rest/v1/session >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

# File-based Docker secrets: create these files (mode 600) before `up`; they are
# gitignored. `docker compose config` still validates when they are absent, so CI
# stays green — they are only read at container start (#33).
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_password:
    file: ./secrets/mysql_password

volumes:
  certs:
  vhost:
  html:
  acme:
  db-data:
  openmrs-data:

networks:
  proxy-net:
    name: proxy-net
  openmrs-net:
    name: openmrs-net
